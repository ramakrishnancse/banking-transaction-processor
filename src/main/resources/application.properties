spring.application.name=banking-transaction-processor

# H2 in file mode: data survives restarts. For a throwaway database use:
#   jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.url=jdbc:h2:file:./data/bankdb;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the data at http://localhost:8080/h2-console (JDBC URL as above). Disable outside development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.web.pageable.max-page-size=100
